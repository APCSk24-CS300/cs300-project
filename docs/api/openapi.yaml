      responses:
        '200':
          description: Criterion updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoreCriterionResponse'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
