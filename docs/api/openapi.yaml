  /admin/score-criteria/{criteriaId}/policy-versions:
    get:
      tags:
      - Admin - Score Criteria
      summary: List scoring policy versions
      operationId: listScoringPolicyVersions
      parameters:
      - $ref: '#/components/parameters/CriteriaId'
      - $ref: '#/components/parameters/SemesterId'
      responses:
        '200':
          description: Policy versions retrieved.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ScoringPolicyVersion'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - Admin - Score Criteria
      summary: Create a scoring policy version
      description: 'Creates a new draft version for one semester. There is no endpoint to edit a version: a version
        used by an award is immutable, and any rule change is a new version (NFR-SCA-INT-05). Returns 400 when minPoints
        > maxPoints.'
      operationId: createScoringPolicyVersion
      parameters:
      - $ref: '#/components/parameters/CriteriaId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateScoringPolicyVersionRequest'
      responses:
        '201':
          description: Policy version created.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringPolicyVersionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/score-criteria/{criteriaId}/policy-versions/{versionId}/activate:
    post:
      tags:
      - Admin - Score Criteria
      summary: Activate a scoring policy version
      description: Activates the version now or schedules it for activationAt. Call preview first and show it for
        confirmation (NFR-USA-13). Existing awards keep the version originally applied. The previously active version
        of the same criterion and semester becomes superseded.
      operationId: activateScoringPolicyVersion
      parameters:
      - $ref: '#/components/parameters/CriteriaId'
      - $ref: '#/components/parameters/VersionId'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          description: Policy version activation scheduled or completed.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScoringPolicyVersionResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Version is not in draft status (`code: INVALID_STATE`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason:
                  type: string
                  minLength: 1
                  description: Audit reason (NFR-SEC-06).
