      summary: Get training-score distribution statistics
      operationId: getTrainingScoreReport
      parameters:
      - $ref: '#/components/parameters/SemesterId'
      - $ref: '#/components/parameters/AcademicYear'
      - $ref: '#/components/parameters/From'
      - $ref: '#/components/parameters/To'
      - name: organizationId
        in: query
        schema:
          type: string
      responses:
        '200':
          description: Training-score statistics retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrainingScoreReportResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '400':
          description: Invalid filter or date range, e.g. `to` earlier than `from` (UC-31 A2).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: 'Return aggregate values and chart-ready breakdowns for dashboard widgets. Filters: semester,
        academic year, date range and organization. No matching records returns zeros, not an error (UC-31 A3).'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    UserId:
      name: userId
      in: path
      required: true
      schema:
        type: string
      description: User identifier.
    ServiceId:
      name: serviceId
      in: path
      required: true
      schema:
        type: string
      description: University service identifier.
    RoleId:
      name: roleId
      in: path
      required: true
      schema:
        type: string
      description: Role identifier.
    CategoryId:
      name: categoryId
      in: path
      required: true
      schema:
        type: string
      description: Activity category identifier.
    CriteriaId:
      name: criteriaId
      in: path
      required: true
      schema:
        type: string
      description: Training-score criterion identifier.
    AcademicYear:
      name: academicYear
      in: query
      schema:
        type: string
      description: Academic year, for example 2026-2027.
    SemesterId:
      name: semesterId
      in: query
      schema:
        type: string
      description: Semester identifier returned by GET /semesters.
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 10
    IfMatch:
      name: If-Match
      in: header
      required: false
      schema:
        type: string
      description: ETag of the version the administrator reviewed. Strongly recommended for every admin mutation;
        a mismatch returns 412.
    OrganizationId:
      name: organizationId
      in: path
      required: true
      schema:
        type: string
    MembershipId:
      name: membershipId
      in: path
      required: true
      schema:
        type: string
    VersionId:
      name: versionId
      in: path
      required: true
      schema:
        type: string
      description: Scoring policy version identifier.
    ImportId:
      name: importId
      in: path
      required: true
      schema:
        type: string
    From:
      name: from
      in: query
      schema:
        type: string
        format: date
    To:
      name: to
      in: query
      schema:
        type: string
        format: date
      description: Inclusive end date; must not be earlier than `from`.
  schemas:
    UserRole:
      type: string
      enum:
      - student
      - manager
      - administrator
    AccountStatus:
      type: string
      enum:
      - active
      - inactive
    ApiMessage:
      type: object
      required:
      - success
      - message
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Operation completed successfully
    ErrorResponse:
      type: object
      required:
      - success
      - code
      - message
      description: 'Error envelope. `code` values used by this contract: UNAUTHENTICATED, FORBIDDEN, NOT_FOUND,
        VALIDATION_FAILED, CURRENT_PASSWORD_INCORRECT, UNSUPPORTED_FILE, DUPLICATE_VALUE, INVALID_STATE, ROLE_POLICY_VIOLATION,
        POLICY_VERSION_IMMUTABLE, IMPORT_EXPIRED, PRECONDITION_FAILED.'
      properties:
        success:
          type: boolean
          example: false
        code:
          type: string
          example: VALIDATION_FAILED
        message:
          type: string
          example: Validation failed
        errors:
          type: array
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
                example: phoneNumber
              code:
                type: string
                example: INVALID_FORMAT
              message:
                type: string
    UpdateProfileRequest:
      type: object
      minProperties: 1
      properties:
        phoneNumber:
          type: string
          nullable: true
          example: '0901234567'
      description: The account owner can edit phone number only. Full name, student number, and faculty are staff-controlled.
    AcademicInfo:
      type: object
      properties:
        studentNumber:
          type: string
          nullable: true
        faculty:
          type: object
          allOf:
          - $ref: '#/components/schemas/FacultySummary'
          nullable: true
        major:
          type: string
          nullable: true
        enrollmentYear:
          type: integer
          nullable: true
      readOnly: true
      description: Staff-controlled; read-only to the account owner.
    Profile:
      type: object
      properties:
        id:
          type: string
          example: user-001
        email:
          type: string
          format: email
          example: student@hcmus.edu.vn
        fullName:
          type: string
          example: Nguyen Van A
          readOnly: true
        phoneNumber:
          type: string
          nullable: true
          example: '0901234567'
        avatarUrl:
          type: string
          format: uri
          nullable: true
        academicInfo:
          allOf:
          - $ref: '#/components/schemas/AcademicInfo'
          nullable: true
          type: object
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
        interests:
          type: array
          items:
            $ref: '#/components/schemas/ActivityCategorySummary'
        status:
          $ref: '#/components/schemas/AccountStatus'
    ProfileResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/Profile'
    AvatarResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          example: Avatar updated successfully
        data:
          type: object
          properties:
            avatarUrl:
              type: string
              format: uri
    ChangePasswordRequest:
      type: object
      required:
      - currentPassword
      - newPassword
      properties:
        currentPassword:
          type: string
          format: password
        newPassword:
          type: string
          format: password
          minLength: 8
      description: New-password confirmation is checked by the FE before sending. The new password must be at least
        8 characters.
    UniversityService:
      type: object
      required:
      - id
      - name
      - url
      - displayOrder
      - isActive
      description: Matches the BR ServiceLink entity (service_id, name, url, description, display_order, is_active).
        BR defines no organization, icon or category field.
      properties:
        id:
          type: string
          example: service-001
          readOnly: true
        name:
          type: string
          example: Moodle
        description:
          type: string
          nullable: true
          example: Online learning management system
        url:
          type: string
          format: uri
          example: https://moodle.hcmus.edu.vn
        displayOrder:
          type: integer
          minimum: 0
          example: 1
        isActive:
          type: boolean
          example: true
        version:
          type: integer
          readOnly: true
          example: 1
    CreateUserRequest:
      type: object
      required:
      - email
      - fullName
      - roles
      properties:
        email:
          type: string
          format: email
        fullName:
          type: string
        roles:
          type: array
          minItems: 1
          uniqueItems: true
          items:
            $ref: '#/components/schemas/UserRole'
        studentNumber:
          type: string
          nullable: true
          description: Required for student duty; staff-provisioned and unique.
        facultyId:
          type: string
          nullable: true
          description: Required for student duty; staff-provisioned and validated.
        phoneNumber:
          type: string
          nullable: true
      description: Create one user identity with one or more independently assigned duties. Password activation/invitation
        is a separate flow.
    AdminUpdateUserRequest:
      type: object
      required:
      - reason
      description: Staff-controlled fields. At least one of fullName or phoneNumber must be present in addition
        to reason.
      properties:
        fullName:
          type: string
          minLength: 1
        phoneNumber:
          type: string
          nullable: true
        reason:
          type: string
          minLength: 1
          description: Audit reason for staff-controlled changes.
    AdminUser:
      type: object
      properties:
        id:
          type: string
          example: user-001
        email:
          type: string
          format: email
        fullName:
          type: string
        phoneNumber:
          type: string
          nullable: true
        status:
          $ref: '#/components/schemas/AccountStatus'
        studentNumber:
          type: string
          nullable: true
          description: Renamed from studentId (API-GAP-006).
        faculty:
          type: object
          allOf:
          - $ref: '#/components/schemas/FacultySummary'
          nullable: true
        roles:
          type: array
          items:
            $ref: '#/components/schemas/UserRole'
        permissions:
          type: array
          items:
            type: string
          readOnly: true
          description: Effective permission codes, shown before an administrator edits roles (NFR-USA-13). Included
            in single-user responses; may be omitted in list items.
        createdAt:
          type: string
          format: date-time
          readOnly: true
        version:
          type: integer
          readOnly: true
          example: 3
    AdminUserResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/AdminUser'
    UserListResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
          - items
          - pagination
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/AdminUser'
            pagination:
              $ref: '#/components/schemas/Pagination'
    Pagination:
      type: object
      properties:
        page:
          type: integer
          example: 1
        limit:
          type: integer
          example: 10
        totalItems:
          type: integer
          example: 100
        totalPages:
          type: integer
          example: 10
      required:
      - page
      - limit
      - totalItems
      - totalPages
    Role:
      type: object
      properties:
        id:
          type: string
          example: role-001
        code:
          $ref: '#/components/schemas/UserRole'
        name:
          type: string
          example: Manager
        description:
          type: string
    Permission:
      type: object
      properties:
        id:
          type: string
          example: permission-001
        code:
          type: string
          example: registration.create
          description: Stable permission code as defined in BR (e.g. activity.manage, score.adjust, criteria.manage).
        description:
          type: string
    RolePermissionsResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            role:
              $ref: '#/components/schemas/Role'
            permissions:
              type: array
              items:
                $ref: '#/components/schemas/Permission'
            version:
              type: integer
              readOnly: true
    ActivityCategory:
      type: object
      properties:
        id:
          type: string
          example: category-001
        name:
          type: string
          example: Academic
        description:
          type: string
        isActive:
          type: boolean
          example: true
        version:
          type: integer
          readOnly: true
      description: isActive=false hides the category from new activities and interest selection; existing references
        stay valid.
    CreateActivityCategoryRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        description:
          type: string
    UpdateActivityCategoryRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          maxLength: 100
        description:
          type: string
        isActive:
          type: boolean
    ActivityCategoryResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/ActivityCategory'
    ScoreCriterion:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
        description:
          type: string
        isActive:
          type: boolean
        policyVersions:
          type: array
          items:
            $ref: '#/components/schemas/ScoringPolicyVersion'
        version:
          type: integer
          readOnly: true
    CreateScoreCriterionRequest:
      type: object
      required:
      - code
      - name
      properties:
        code:
          type: string
        name:
          type: string
        description:
          type: string
    UpdateScoreCriterionRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
        description:
          type: string
        isActive:
          type: boolean
      description: Do not edit a policy version already used by a score award.
    ScoreCriterionResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
        data:
          $ref: '#/components/schemas/ScoreCriterion'
    OverviewReportResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            totalUsers:
              type: integer
              example: 5000
            totalStudents:
              type: integer
              example: 4700
            totalManagers:
              type: integer
              example: 280
              description: Users holding the manager duty. Replaces totalOrganizers (API-GAP-008).
            totalActivities:
              type: integer
              example: 250
            totalRegistrations:
              type: integer
              example: 12000
    GenericReportResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          additionalProperties: true
          description: Report-specific aggregation fields. Formulas and granularity are TBD in UC-31; finalize with
            the backend team.
    TrainingScoreReportResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          properties:
            semesterId:
              type: string
              example: sem-2026-1
            totalStudents:
              type: integer
              example: 4700
            averageScore:
              type: number
              example: 75.5
            distribution:
              type: array
              items:
                type: object
                properties:
                  range:
                    type: string
                    example: 0-50
                  studentCount:
                    type: integer
                    example: 300
    FacultySummary:
      type: object
      properties:
        id:
          type: string
        code:
          type: string
        name:
          type: string
    ActivityCategorySummary:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
    ScoringPolicyVersion:
      type: object
      properties:
        id:
          type: string
        criterionId:
          type: string
        semesterId:
          type: string
        activationAt:
          type: string
          format: date-time
        weight:
          type: number
          minimum: 0
          example: 1.5
          description: Multiplier, not a percentage. weightedPoints = basePoints x weight, rounded to 2 decimals
            (BR).
        minPoints:
          type: number
          minimum: 0
          example: 0
          description: Lowest allowed base points for one award under this criterion. Must be <= maxPoints.
        maxPoints:
          type: number
          minimum: 0
          example: 10
          description: Highest allowed base points for one award. Must be >= minPoints; otherwise 400 VALIDATION_FAILED.
        semesterCap:
          type: number
          minimum: 0
          example: 20
          description: Upper bound of a student's total for this criterion in the semester, after weights and approved
            adjustments. Totals are bounded to [0, semesterCap].
        isUsed:
          type: boolean
          readOnly: true
          description: True once any award applied this version; the version is then immutable.
        status:
          type: string
          enum:
          - draft
          - scheduled
          - active
          - superseded
          description: draft -> scheduled (activationAt in the future) or active; active -> superseded when a later
            version activates.
        version:
          type: integer
          readOnly: true
    Organization:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        type:
          type: string
          enum:
          - club
          - faculty_unit
          - department
          - student_affairs_office
        isActive:
          type: boolean
    OrganizationMembership:
      type: object
      properties:
        membershipId:
          type: string
        organization:
          $ref: '#/components/schemas/Organization'
        userId:
          type: string
        responsibility:
          type: string
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
          nullable: true
        isActive:
          type: boolean
    CurrentUserContextResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
        data:
          type: object
          properties:
            user:
              $ref: '#/components/schemas/Profile'
            permissions:
              type: array
              items:
                type: string
            activeOrganizationMemberships:
              type: array
              items:
                $ref: '#/components/schemas/OrganizationMembership'
            activeActivityAssignments:
              type: array
              items:
                type: string
    CreateServiceLinkRequest:
      type: object
      required:
      - name
      - url
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          format: uri
          description: Absolute http(s) URL of the external service.
        description:
          type: string
          nullable: true
        displayOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
          default: true
    UpdateServiceLinkRequest:
      type: object
      minProperties: 1
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 100
        url:
          type: string
          format: uri
        description:
          type: string
          nullable: true
        displayOrder:
          type: integer
          minimum: 0
        isActive:
          type: boolean
    CreateScoringPolicyVersionRequest:
      type: object
      required:
      - semesterId
      - activationAt
      - weight
      - minPoints
      - maxPoints
      - semesterCap
      description: 'Creates a draft version. Cross-field rule: minPoints <= maxPoints.'
      properties:
        semesterId:
          type: string
        activationAt:
          type: string
          format: date-time
          description: When the version becomes effective for new awards in semesterId.
        weight:
          type: number
          minimum: 0
          example: 1.5
          description: Multiplier, not a percentage. weightedPoints = basePoints x weight, rounded to 2 decimals
            (BR).
        minPoints:
          type: number
          minimum: 0
          example: 0
          description: Lowest allowed base points for one award under this criterion. Must be <= maxPoints.
        maxPoints:
          type: number
          minimum: 0
          example: 10
          description: Highest allowed base points for one award. Must be >= minPoints; otherwise 400 VALIDATION_FAILED.
        semesterCap:
          type: number
          minimum: 0
          example: 20
          description: Upper bound of a student's total for this criterion in the semester, after weights and approved
            adjustments. Totals are bounded to [0, semesterCap].
    ScoringPolicyVersionResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/ScoringPolicyVersion'
    PolicyImpactPreview:
      type: object
      description: Impact of activating a version. Historical awards are never recalculated; they keep their applied
        version.
      properties:
        versionId:
          type: string
        criterionId:
          type: string
        affectedSemesters:
          type: array
          items:
            type: string
        currentVersion:
          type: object
          allOf:
          - $ref: '#/components/schemas/ScoringPolicyVersion'
          nullable: true
          description: Version this one would supersede, if any.
        proposedVersion:
          $ref: '#/components/schemas/ScoringPolicyVersion'
        affectedActivityCount:
          type: integer
          description: Activities in the semester that advertise this criterion.
        existingAwardCount:
          type: integer
          description: Awards already made under earlier versions; unchanged by activation.
        warnings:
          type: array
          items:
            type: string
    Semester:
      type: object
      properties:
        id:
          type: string
        quarterAcademicYear:
          type: string
          description: Follows BR v1.2.0 `quarter_academic_year`. The two BR files disagree (academic_year + term);
            confirm.
        startsAt:
          type: string
          format: date-time
        endsAt:
          type: string
          format: date-time
    OrganizationListResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          example: true
        data:
          type: object
          required:
          - items
          - pagination
          properties:
            items:
              type: array
              items:
                $ref: '#/components/schemas/Organization'
            pagination:
              $ref: '#/components/schemas/Pagination'
    OrganizationMembershipResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          example: true
        data:
          $ref: '#/components/schemas/OrganizationMembership'
    AuditLogEntry:
      type: object
      description: Append-only record per BR AuditLog. Not editable through any endpoint.
      properties:
        id:
          type: string
        occurredAt:
          type: string
          format: date-time
        actor:
          type: object
          properties:
            id:
              type: string
            fullName:
              type: string
        action:
          type: string
          example: user.roles.replace
        entityType:
          type: string
          example: User
        entityId:
          type: string
        reason:
          type: string
          nullable: true
        beforeValues:
          type: object
          nullable: true
          additionalProperties: true
        afterValues:
          type: object
          nullable: true
          additionalProperties: true
    ImportResource:
      type: string
      enum:
      - users
      - user-roles
      - score-criteria
      - activity-categories
      description: users and user-roles serve UC-29; score-criteria and activity-categories serve UC-30. Activity
        and attendance imports belong to the manager contracts.
    ImportRowResult:
      type: object
      properties:
        rowNumber:
          type: integer
          description: 1-based row number in the uploaded file, excluding the header.
        status:
          type: string
          enum:
          - valid
          - invalid
        action:
          type: string
          enum:
          - create
          - update
          - none
          nullable: true
        errors:
          type: array
          items:
            type: object
            properties:
              field:
                type: string
              code:
                type: string
                example: DUPLICATE_VALUE
              message:
                type: string
        proposedValues:
          type: object
          additionalProperties: true
    ImportSession:
      type: object
      description: Result of validation. Nothing is written until confirm. Invalid rows are excluded from confirm
        (UC-29 A5, UC-30 A4).
      properties:
        id:
          type: string
          example: import-001
        resource:
          $ref: '#/components/schemas/ImportResource'
        status:
          type: string
          enum:
          - validated
          - confirmed
          - cancelled
          - expired
        fileName:
          type: string
        totalRows:
          type: integer
        validRows:
          type: integer
        invalidRows:
          type: integer
        rows:
          type: array
          items:
            $ref: '#/components/schemas/ImportRowResult'
        result:
          type: object
          nullable: true
          description: Present after confirm.
          properties:
            created:
              type: integer
            updated:
              type: integer
            skipped:
              type: integer
        createdAt:
          type: string
          format: date-time
        expiresAt:
          type: string
          format: date-time
    ImportSessionResponse:
      type: object
      required:
      - success
      - data
      properties:
        success:
          type: boolean
          example: true
