openapi: 3.0.3
info:
  title: myHCMUS API
  version: 1.2.0
  description: 'FE-oriented API contract for three functional groups: Profile Management (UC-03), University Services
    Hub (UC-07) and System Administration (UC-29, UC-30, UC-31).


    Aligned with Business Requirements Analysis v1.2.0. A User may hold multiple independently assigned duties (student,
    manager, administrator). Permissions do not inherit automatically; manager actions also require the relevant
    organization, activity, or request assignment.


    Conventions:

    - Base path is versioned: `/api/v1`. Breaking changes require a new major path version.

    - Every response uses the `{ success, data | message }` envelope. Errors use `ErrorResponse`, whose `code` is
    the stable machine-readable value FE logic may branch on; `message` is for display only.

    - Property and query names are camelCase.

    - Lists that can grow without bound (users, organizations, memberships, audit logs) are paginated with `page`/`limit`
    and return `data.items` + `data.pagination`. Small reference lists (roles, permissions, faculties, semesters,
    categories, service links) are returned whole.

    - Optimistic concurrency: single-resource admin responses carry an `ETag` header equal to the quoted `version`
    field of the resource. Mutations accept `If-Match`; a stale value returns `412 PRECONDITION_FAILED` and the
    FE must reload the latest state (UC-29 A8, UC-30 A9).

    - Accounts, categories, criteria and service links are deactivated, never physically deleted.

    - Training-score awards, adjustments, appeals and student score views belong to the Participation/Training-Score
    and Requests contracts, not to this file.'
servers:
- url: http://localhost:8080/api/v1
  description: Local development server
tags:
- name: Authentication & Session
  description: Current session context (login/logout pending API-GAP-002).
- name: Profile
  description: Current user's personal and academic profile (UC-03).
- name: University Services Hub
  description: Directory of external university services (UC-07) and its administration.
- name: Reference Data
  description: Faculties and semesters used by forms and filters.
- name: Admin - Users
  description: User account provisioning and administration (UC-29).
- name: Admin - Roles & Permissions
  description: Role and permission configuration (UC-29).
- name: Admin - Organizations
  description: Organizations and manager membership scope.
- name: Admin - Activity Categories
  description: Activity category configuration (UC-30).
- name: Admin - Score Criteria
  description: Training-score criteria and versioned scoring policies (UC-30).
- name: Admin - Imports
  description: 'Two-step CSV/XLSX bulk import: validate, review, confirm (UC-29, UC-30, NFR-COM-04).'
- name: Admin - Audit Logs
  description: Read-only audit history (NFR-SEC-06).
- name: Admin - Reports
  description: Administrative reports and statistics (UC-31).
security:
- bearerAuth: []
paths:
  /auth/me:
    get:
      tags:
      - Authentication & Session
      summary: Get current user context
      description: Call after login and on page refresh to initialize role-aware navigation. Includes all assigned
        roles, effective permission codes, and active operational assignments.
      operationId: getCurrentUserContext
      responses:
        '200':
          description: Current user context.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CurrentUserContextResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /profile:
    get:
      tags:
      - Profile
      summary: Get current user's profile
      description: Retrieve the authenticated user's personal profile and read-only academic information, if available.
      operationId: getMyProfile
      responses:
        '200':
          description: Profile retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    patch:
      tags:
      - Profile
      summary: Update current user's profile
      description: Update phone number only. Full name, student number, and faculty are read-only to the account
        owner.
      operationId: updateMyProfile
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Profile updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProfileResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /profile/avatar:
    post:
      tags:
      - Profile
      summary: Upload or update profile avatar
      description: Upload a JPG or PNG image up to 5 MB. The new image replaces the current avatar.
      operationId: uploadMyAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - avatar
              properties:
                avatar:
                  type: string
                  format: binary
                  description: JPG or PNG image, maximum 5 MB.
      responses:
        '200':
          description: Avatar updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AvatarResponse'
        '400':
          description: 'File is not JPG/PNG or exceeds 5 MB (`code: UNSUPPORTED_FILE`). Existing avatar is kept
            (UC-03 A8).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    delete:
      tags:
      - Profile
      summary: Remove profile avatar
      description: Remove the current avatar and restore the default avatar.
      operationId: deleteMyAvatar
      responses:
        '200':
          $ref: '#/components/responses/MessageSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /profile/interests:
    get:
      tags:
      - Profile
      summary: Get current user's interests
      operationId: getMyInterests
      responses:
        '200':
          description: Interests retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestsResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
    put:
      tags:
      - Profile
      summary: Replace current user's interests
      description: Replaces optional ActivityCategory preferences for discovery and advisory recommendations. Every
        id must be an active category from GET /activity-categories; an empty array clears interests.
      operationId: replaceMyInterests
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - categoryIds
              properties:
                categoryIds:
                  type: array
                  uniqueItems: true
                  items:
                    type: string
      responses:
        '200':
          description: Interests updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InterestsResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /profile/password:
    patch:
      tags:
      - Profile
      summary: Change current user's password
      description: Verify the current password before setting a new password.
      operationId: changeMyPassword
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          $ref: '#/components/responses/MessageSuccess'
        '400':
          description: 'Validation failed, or the current password is incorrect (`code: CURRENT_PASSWORD_INCORRECT`).
            The password is unchanged (UC-03 A7).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                success: false
                code: CURRENT_PASSWORD_INCORRECT
                message: Current password is incorrect
                errors:
                - field: currentPassword
                  code: INCORRECT
                  message: Current password is incorrect
        '401':
          $ref: '#/components/responses/Unauthorized'
  /activity-categories:
    get:
      tags:
      - Profile
      summary: List active activity categories
      description: Non-admin read for the interests panel (API-GAP-001). Returns active categories only.
      operationId: listActivityCategoriesForInterests
      responses:
        '200':
          description: Active categories retrieved.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/ActivityCategory'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /hub/services:
    get:
      tags:
      - University Services Hub
      summary: List active university services
      description: Retrieve active external service links ordered by displayOrder. An empty array means no links
        are configured (UC-07 A1). Links open external sites; myHCMUS does not proxy or integrate with them.
      operationId: listUniversityServices
      responses:
        '200':
          description: Services retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UniversityService'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /hub/services/{serviceId}:
    get:
      tags:
      - University Services Hub
      summary: Get university service details
      description: Retrieve details of one active university service.
      operationId: getUniversityService
      parameters:
      - $ref: '#/components/parameters/ServiceId'
      responses:
        '200':
          description: Service retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/UniversityService'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: Service does not exist or is inactive.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/services:
    get:
      tags:
      - University Services Hub
      summary: List service links for administration
      operationId: adminListServices
      parameters:
      - name: includeInactive
        in: query
        schema:
          type: boolean
          default: true
      responses:
        '200':
          description: Service links retrieved.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/UniversityService'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
    post:
      tags:
      - University Services Hub
      summary: Create a university service link
      operationId: createServiceLink
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateServiceLinkRequest'
      responses:
        '201':
          description: Service link created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniversityServiceResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/services/{serviceId}:
    patch:
      tags:
      - University Services Hub
      summary: Update a university service link
      operationId: updateServiceLink
      parameters:
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateServiceLinkRequest'
      responses:
        '200':
          description: Service link updated.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UniversityServiceResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
    delete:
      tags:
      - University Services Hub
      summary: Deactivate a service link
      operationId: deactivateServiceLink
      parameters:
      - $ref: '#/components/parameters/ServiceId'
      - $ref: '#/components/parameters/IfMatch'
      responses:
        '200':
          $ref: '#/components/responses/MessageSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
      description: Sets isActive=false. The link disappears from the hub; the record is kept.
  /semesters:
    get:
      tags:
      - Reference Data
      summary: List semesters
      description: Returns semesters for FE filters and score-policy forms.
      operationId: listSemesters
      parameters:
      - name: academicYear
        in: query
        schema:
          type: string
      - name: currentOnly
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Semesters retrieved.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Semester'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /admin/faculties:
    get:
      tags:
      - Reference Data
      summary: List faculties
      operationId: listFaculties
      responses:
        '200':
          description: Faculties retrieved.
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/FacultySummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/users:
    post:
      tags:
      - Admin - Users
      summary: Create a user account
      description: Provision one identity with one or more independent duties. Student number and faculty are staff-controlled
        and must be validated before eligibility-dependent actions.
      operationId: createUser
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateUserRequest'
      responses:
        '201':
          description: User account created successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          description: 'Email or student number already exists (`code: DUPLICATE_VALUE`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    get:
      tags:
      - Admin - Users
      summary: List and search user accounts
      operationId: listUsers
      parameters:
      - name: search
        in: query
        description: Search by full name, email, or student number.
        schema:
          type: string
      - name: role
        in: query
        schema:
          $ref: '#/components/schemas/UserRole'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/AccountStatus'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - name: facultyId
        in: query
        schema:
          type: string
      - name: sortBy
        in: query
        schema:
          type: string
          enum:
          - createdAt
          - fullName
          - email
          default: createdAt
      - name: sortOrder
        in: query
        schema:
          type: string
          enum:
          - asc
          - desc
          default: desc
      responses:
        '200':
          description: Users retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserListResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
      description: Search by full name, email, or student number. A user may have multiple roles; the role filter
        matches users holding the selected role.
  /admin/users/{userId}:
    get:
      tags:
      - Admin - Users
      summary: Get user details
      operationId: getUserById
      parameters:
      - $ref: '#/components/parameters/UserId'
      responses:
        '200':
          description: User retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    patch:
      tags:
      - Admin - Users
      summary: Update user information
      description: Update staff-controlled user fields. Academic identity and role changes use dedicated endpoints;
        include an audit reason.
      operationId: updateUser
      parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminUpdateUserRequest'
      responses:
        '200':
          description: User updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /admin/users/{userId}/academic-info:
    patch:
      tags:
      - Admin - Users
      summary: Validate or update student academic identity
      description: Staff-controlled student number and faculty. Must be validated before eligibility-dependent registration
        or appeal submission. Changes require an audit reason.
      operationId: updateUserAcademicInfo
      parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - reason
              properties:
                studentNumber:
                  type: string
                  nullable: true
                facultyId:
                  type: string
                  nullable: true
                reason:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Academic identity updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Student number already exists (`code: DUPLICATE_VALUE`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /admin/users/{userId}/roles:
    put:
      tags:
      - Admin - Users
      summary: Replace a user's assigned roles
      description: Replace the complete set of independently assigned roles. Permissions are not inherited automatically.
        Records an audit reason. Assignments that violate permission policy return 400 `ROLE_POLICY_VIOLATION` (UC-29
        A6). Updated permissions apply from the user's next request (UC-29 A10).
      operationId: replaceUserRoles
      parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - roles
              - reason
              properties:
                roles:
                  type: array
                  minItems: 1
                  uniqueItems: true
                  items:
                    $ref: '#/components/schemas/UserRole'
                reason:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Roles updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /admin/users/{userId}/status:
    patch:
      tags:
      - Admin - Users
      summary: Activate or deactivate a user account
      description: 'Activate or deactivate an account. This is how UC-29 ''delete user'' is implemented: accounts
        are never physically deleted. Deactivation revokes active sessions and preserves historical records.'
      operationId: updateUserStatus
      parameters:
      - $ref: '#/components/parameters/UserId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - status
              - reason
              properties:
                status:
                  $ref: '#/components/schemas/AccountStatus'
                reason:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Account status updated successfully.
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdminUserResponse'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
  /admin/roles:
    get:
      tags:
      - Admin - Roles & Permissions
      summary: List available roles
      operationId: listRoles
      responses:
        '200':
          description: Roles retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Role'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/roles/{roleId}/permissions:
    get:
      tags:
      - Admin - Roles & Permissions
      summary: Get permissions assigned to a role
      operationId: getRolePermissions
      parameters:
      - $ref: '#/components/parameters/RoleId'
      responses:
        '200':
          description: Role permissions retrieved successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionsResponse'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags:
      - Admin - Roles & Permissions
      summary: Replace permissions assigned to a role
      operationId: replaceRolePermissions
      parameters:
      - $ref: '#/components/parameters/RoleId'
      - $ref: '#/components/parameters/IfMatch'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - permissionIds
              - reason
              properties:
                permissionIds:
                  type: array
                  items:
                    type: string
                  example:
                  - permission-001
                  - permission-002
                  uniqueItems: true
                reason:
                  type: string
                  minLength: 1
      responses:
        '200':
          description: Role permissions updated successfully.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RolePermissionsResponse'
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '412':
          $ref: '#/components/responses/PreconditionFailed'
      description: Replace the complete permission set for a role. Changes are audited. Multiple roles do not imply
        hierarchy or automatic permission inheritance.
  /admin/permissions:
    get:
      tags:
      - Admin - Roles & Permissions
      summary: List available permissions
      operationId: listPermissions
      responses:
        '200':
          description: Permissions retrieved successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
