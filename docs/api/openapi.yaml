    post:
      tags:
      - Admin - Score Criteria
      summary: Preview scoring policy impact
      description: Preview affected semesters and resulting score changes before activation. Does not overwrite
        historical awards.
      operationId: previewScoringPolicyVersion
      parameters:
      - $ref: '#/components/parameters/CriteriaId'
      - $ref: '#/components/parameters/VersionId'
      responses:
        '200':
          description: Impact preview generated.
          content:
            application/json:
              schema:
                type: object
                required:
                - success
                - data
                properties:
                  success:
                    type: boolean
                    example: true
                  data:
                    $ref: '#/components/schemas/PolicyImpactPreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /admin/imports:
    post:
      tags:
      - Admin - Imports
      summary: Upload and validate an import file
      description: Step 1 of 2. Parses a CSV or XLSX file and validates every row without writing anything. Returns
        row-level results for review (UC-29 steps 4-5, UC-30 steps 4-5, NFR-COM-04). Score-criteria rows create
        new draft policy versions and never edit a used version (UC-30 A5).
      operationId: createImport
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - resource
              - file
              properties:
                resource:
                  $ref: '#/components/schemas/ImportResource'
                file:
                  type: string
                  format: binary
                  description: CSV or XLSX. Column templates are agreed with BE.
      responses:
        '201':
          description: File validated; import session created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSessionResponse'
        '400':
          description: 'File is unreadable or not CSV/XLSX (`code: UNSUPPORTED_FILE`) (UC-29 A3, UC-30 A2).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /admin/imports/{importId}:
    get:
      tags:
      - Admin - Imports
      summary: Get an import session
      operationId: getImport
      parameters:
      - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: Import session retrieved.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
    delete:
      tags:
      - Admin - Imports
      summary: Cancel an import session
      description: Discards a validated session; nothing is saved (UC-29 A2/A7, UC-30 A1/A8).
      operationId: cancelImport
      parameters:
      - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          $ref: '#/components/responses/MessageSuccess'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Session is already confirmed (`code: INVALID_STATE`).'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /admin/imports/{importId}/confirm:
    post:
      tags:
      - Admin - Imports
      summary: Confirm an import
      description: 'Step 2 of 2. Applies valid rows in one transaction and writes audit entries; invalid rows are
        skipped. Idempotent: confirming an already confirmed session returns the original result without applying
        rows again, so a retry cannot import twice.'
      operationId: confirmImport
      parameters:
      - $ref: '#/components/parameters/ImportId'
      responses:
        '200':
          description: Import applied (or already applied).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportSessionResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: 'Session is cancelled or expired (`code: IMPORT_EXPIRED`), or data changed since validation;
            validate the file again.'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
