name: myHCMUS
services:
  server:
    container_name: myHCMUS-server
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    env_file:
      - server/.env
      # The DB credentials live in db/.env; the server reads the same POSTGRES_USER/PASSWORD.
      - db/.env
    environment:
      # schema.sql creates the database "myHCMUS" (POSTGRES_DB in db/.env only names the bootstrap DB).
      POSTGRES_DB: myHCMUS
      AVATAR_STORAGE_DIRECTORY: /app/data/avatars
    volumes:
      - ./server:/app
      - node_modules:/app/node_modules
      # Avatar files persist outside the bind-mounted source (UC-03, implementation.md).
      - avatars:/app/data/avatars
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  client:
    container_name: myHCMUS-client
    image: node:22
    working_dir: /app
    # node_modules lives in a volume so Linux binaries never mix with the Windows ones in src/client.
    command: sh -c "npm install && npm run dev -- --hostname 0.0.0.0"
    ports:
      - '3000:3000'
    env_file:
      - path: client/.env.local
        required: false
    environment:
      # Inside Docker the backend is reached by its service name, not localhost.
      BACKEND_API_URL: http://server:8080/api/v1
      # File changes on a Windows bind mount are only seen by polling.
      WATCHPACK_POLLING: 'true'
    volumes:
      - ./client:/app
      - client_node_modules:/app/node_modules
      - client_next:/app/.next
    depends_on:
      - server
    restart: unless-stopped

  db:
    image: pgvector/pgvector:pg18-trixie
    container_name: myHCMUS-db
    restart: always
    env_file:
      - ./db/.env
    ports:
          - "5432:5432"
    volumes:
            - myHCMUS-db:/var/lib/postgresql
            # First start on an empty volume: schema → ai_schema → seed → hub_schema (no *_test.sql).
            - ./db:/myhcmus-db:ro
            - ./db/docker-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
  node_modules:
  myHCMUS-db:
  avatars:
  client_node_modules:
  client_next:
