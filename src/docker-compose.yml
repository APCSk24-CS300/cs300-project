name: myHCMUS
services:
  server:
    container_name: myHCMUS-server
    build:
      context: ./server
      dockerfile: Dockerfile
    ports:
      - '8080:8080'
    env_file:
      - server/.env
    volumes:
      - ./server:/app
      - node_modules:/app/node_modules
    restart: unless-stopped

  db:
    container_name: myHCMUS-db
    image: postgres:18
    restart: always
    env_file:
      - ./db/.env
    ports:
            - "5432:5432"
    volumes:
            - postgres_data:/var/lib/postgresql
    healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 5

volumes:
  node_modules:
  postgres_data: